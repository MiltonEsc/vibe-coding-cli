name: Feature request
description: Suggest an improvement or new capability for Vibe CLI
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Vibe CLI. Focus on the problem and desired outcome before proposing implementation details.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you running into?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behavior would you like Vibe CLI to support?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: Show how the feature could look from the CLI or project workflow.
      render: shell

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative approaches you have considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request keeps `vibe init` free of automatic remote script execution.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
