name: Bug report
description: Report a reproducible problem with Vibe CLI
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.

  - type: input
    id: version
    attributes:
      label: Vibe CLI version
      description: Run `vibe --version` or `npx @vibe-coding-cli/cli --version`.
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: v22.x.x
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: What command or sequence of commands triggered the problem?
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the relevant error output.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the issue in a fresh directory when possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, selected stacks, package manager, or other relevant details.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, tokens, and other secrets from the report.
          required: true
